services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 3s
      timeout: 5s
      retries: 10

  messenger-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - jwt-secret=dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - ./build-release/messenger_service
      - --config
      - /service/configs/static_config.yaml
      - --config_vars
      - /service/configs/config_vars.docker.yaml
